<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1318">
<meta name="mobile-web-app-capable" content="yes">
<title>Bowling Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="nav" aria-label="Main">
    <button type="button" class="navb" data-act="tab" data-tab="bowl">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="9.5" cy="9.5" r="1" fill="currentColor"></circle><circle cx="13.5" cy="8.5" r="1" fill="currentColor"></circle><circle cx="12.5" cy="12.5" r="1" fill="currentColor"></circle></svg>
      Bowl
    </button>
    <button type="button" class="navb" data-act="tab" data-tab="stats">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="6" r="2.2"></circle><circle cx="12" cy="6" r="2.2"></circle><circle cx="18" cy="6" r="2.2"></circle><circle cx="9" cy="12" r="2.2"></circle><circle cx="15" cy="12" r="2.2"></circle><circle cx="12" cy="18" r="2.2"></circle></svg>
      Leaves
    </button>
    <button type="button" class="navb" data-act="tab" data-tab="games">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14"></path><path d="M5 12h14"></path><path d="M5 17h9"></path></svg>
      Games
    </button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
